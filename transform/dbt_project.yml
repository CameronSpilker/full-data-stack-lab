name: "full_data_stack_lab"
version: "0.1.0"
config-version: 2

profile: "full_data_stack_lab"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  full_data_stack_lab:
    +materialized: view
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

# Model constants. These live here rather than inside the SQL so the predictor
# can be retuned without editing a model, and so every mart that makes a
# prediction is guaranteed to be using the same numbers.
vars:
  # Division I averages. Tempo is possessions per team per 40 minutes.
  league_average_tempo: 68.0

  # Home court is worth about 3.5 points. Applied to the home side only, so a
  # neutral-site game simply passes 0.
  home_court_advantage_points: 3.5

  # The conventional Elo-to-points conversion: 25 rating points per point of
  # expected margin.
  elo_points_per_rating_point: 25.0

  # How the two ratings are blended into one prediction. Adjusted efficiency
  # is the stronger signal and carries more weight; Elo contributes recency,
  # since it moves game to game while a season rating does not.
  efficiency_model_weight: 0.6
  elo_model_weight: 0.4

  # Points-to-probability scale for college basketball. A 5.5-point favourite
  # wins roughly 73% of the time.
  spread_to_probability_scale: 5.5

  # Monte Carlo runs behind the tournament odds. 20,000 puts the standard
  # error on a championship probability near a tenth of a point.
  tournament_simulations: 20000

  # What a Division I final score can say. No team has scored under 20 in a
  # regulation game since the shot clock arrived, and no game has finished with
  # a side over 200. A score outside this band is a forfeit, a cancelled
  # fixture, or a bad record, so staging classifies it instead of letting it
  # into the models as a played game.
  plausible_score_min: 20
  plausible_score_max: 200

  # What an adjusted rating can say. collegebasketballdata.com publishes a
  # handful of historical rows outside these bounds: a 160 offensive
  # efficiency, a 37-possession tempo. Those are dropped to null rather than
  # used, so a prediction goes missing instead of going wrong.
  plausible_efficiency_min: 70
  plausible_efficiency_max: 145
  plausible_tempo_min: 50
  plausible_tempo_max: 90
