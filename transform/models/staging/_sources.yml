version: 2

sources:
  - name: raw
    description: >
      Landing tables written by the ingestion layer. Games and box scores are
      immutable history keyed on the ESPN game id; teams and ratings are dated
      snapshots, because both sources report current state rather than history.
    schema: raw
    tables:
      - name: ncaa_teams
        description: One row per Division I team per snapshot date.
        loaded_at_field: extracted_at
        freshness:
          warn_after: { count: 120, period: day }
          error_after: { count: 400, period: day }
        columns:
          - name: team_id
            description: ESPN's team id. Stable across seasons.
            data_tests: [not_null]
          - name: snapshot_date
            data_tests: [not_null]

      - name: ncaa_games
        description: >
          One row per game. ESPN lists a game on every date it appears on, so
          the extractor dedupes on game_id before loading.
        loaded_at_field: extracted_at
        freshness:
          warn_after: { count: 3, period: day }
          error_after: { count: 14, period: day }
        columns:
          - name: game_id
            data_tests: [not_null, unique]
          - name: season
            data_tests: [not_null]
          - name: home_team_id
            data_tests: [not_null]
          - name: away_team_id
            data_tests: [not_null]

      - name: ncaa_ratings
        description: >
          Adjusted efficiency from collegebasketballdata.com, one row per team
          per season per snapshot date. Keyed on the same team id as every
          other table, so it joins without a name crosswalk.
        loaded_at_field: extracted_at
        columns:
          - name: team_id
            data_tests: [not_null]
          - name: team_name
            data_tests: [not_null]
          - name: season
            data_tests: [not_null]

      - name: ncaa_team_box
        description: >
          Team-level box score lines, two rows per game. Populated only for
          the seasons `ingest boxscores` has been run against.
        columns:
          - name: game_id
            data_tests: [not_null]

      - name: ncaa_betting_lines
        description: >
          Closing betting lines, one row per game per sportsbook. The spread is
          quoted from the home team's perspective: negative means the home team
          is favoured. This is the benchmark the predictor is scored against.
        columns:
          - name: game_id
            data_tests: [not_null]
          - name: provider
            data_tests: [not_null]
