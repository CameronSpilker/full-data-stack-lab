version: 2

models:
  - name: stg_ncaa__teams
    description: >
      The Division I team dimension, reduced to the most recent snapshot.
      One row per team.
    columns:
      - name: team_id
        description: The source's team id. Stable across seasons, and the join key everywhere.
        data_tests: [not_null, unique]
      - name: team_match_key
        description: >
          The team's name normalised for joining against sources that share no
          id with this one — currently Barttorvik. Not unique by construction:
          two schools can normalise to the same key, which is what the
          crosswalk seed exists to resolve.
        data_tests: [not_null]
      - name: conference_name
        description: The conference the team played in as of the latest snapshot.

  - name: stg_ncaa__games
    description: >
      One row per game, typed, with the postseason round parsed out of the
      source's free-text note.
    columns:
      - name: game_id
        data_tests: [not_null, unique]
      - name: season
        description: The calendar year the season ends in. 2026 is the 2025-26 season.
        data_tests: [not_null]
      - name: game_type
        data_tests:
          - accepted_values:
              arguments:
                  values:
                    ['regular_season', 'conference_tournament', 'ncaa_tournament', 'other_postseason']
      - name: tournament_round
        description: Populated only for NCAA tournament games.
        data_tests:
          - accepted_values:
              arguments:
                  values:
                    ['First Four', 'First Round', 'Second Round', 'Sweet 16',
                     'Elite Eight', 'Final Four', 'National Championship']
      - name: home_team_id
        data_tests: [not_null]
      - name: away_team_id
        data_tests: [not_null]
      - name: scoring_status
        description: >
          What the final score means. `played` is a real game. `scheduled` has
          not happened. `not_played` is a cancellation the source still calls
          final, left at 0-0. `forfeit` is the administrative 2-0 or 1-0 the
          NCAA records for a no-contest, common through the COVID seasons.
          `unrecorded` and `implausible` are bad records: a missing score, or
          one outside anything a Division I game produces.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                  values:
                    ['played', 'scheduled', 'not_played', 'forfeit',
                     'unrecorded', 'implausible']
      - name: is_completed
        description: >
          True only for games that were played. A forfeit or a cancellation is
          a real row about the season and a false one about basketball, so it
          is excluded here rather than deleted upstream.
        data_tests: [not_null]
      - name: home_score
        description: Null until the game is played.
      - name: home_margin
        description: Home score minus away score. Negative means the home team lost.

  - name: stg_ncaa__betting_lines
    description: One row per game per sportsbook. Spreads are from the home team's perspective.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: provider
        data_tests: [not_null]
      - name: home_spread
        description: Negative means the home team is favoured.
        data_tests: [not_null]

  - name: stg_ncaa__ratings
    description: >
      Adjusted efficiency from collegebasketballdata.com, reduced to the latest
      snapshot per team per season.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: has_plausible_rating
        description: >
          False where the source published a figure no basketball season can
          produce and this model dropped it to null. The rest of the row is
          kept: the record and the four factors on it are still good.
        data_tests: [not_null]
      # These three now guard the screen rather than the source: an
      # out-of-band value cannot reach the column any more, so a failure means
      # the screening in the model broke.
      - name: adjusted_offensive_efficiency
        description: >
          Points scored per 100 possessions, adjusted for opponent and site.
          Null where the source's figure was outside the plausible band.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: "{{ var('plausible_efficiency_min') }}"
                  max_value: "{{ var('plausible_efficiency_max') }}"
      - name: adjusted_defensive_efficiency
        description: >
          Points allowed per 100 possessions, adjusted. Lower is better. Null
          where the source's figure was outside the plausible band.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: "{{ var('plausible_efficiency_min') }}"
                  max_value: "{{ var('plausible_efficiency_max') }}"
      - name: adjusted_tempo
        description: >
          Possessions per team per 40 minutes. Null where the source's figure
          was outside the plausible band.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: "{{ var('plausible_tempo_min') }}"
                  max_value: "{{ var('plausible_tempo_max') }}"

  - name: stg_ncaa__team_box
    description: Team box score lines with the shooting and possession rates derived.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: effective_fg_pct
        description: Field goal percentage weighting threes at 1.5 twos.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  max_value: 1.5
              config:
                  severity: warn
