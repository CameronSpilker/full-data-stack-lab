version: 2

models:
  - name: stg_github__repos
    description: One cleaned row per tool per snapshot date.
    columns:
      - name: repo_snapshot_id
        description: Surrogate key on (tool_name, snapshot_date).
        data_tests: [unique, not_null]
      - name: tool_name
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('tool_registry')
                field: tool_name
      - name: snapshot_date
        data_tests: [not_null]
      - name: stars
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: forks
        data_tests: [not_null]

  - name: stg_github__contributors
    description: Contributor counts per tool per snapshot date.
    columns:
      - name: contributor_snapshot_id
        data_tests: [unique, not_null]
      - name: tool_name
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('tool_registry')
                field: tool_name
      - name: contributor_count
        data_tests: [not_null]
      - name: is_count_capped
        description: True when GitHub's 500-contributor page cap was hit.

  - name: stg_github__releases
    description: Deduplicated release history, one row per tool per tag.
    columns:
      - name: release_id
        data_tests: [unique, not_null]
      - name: tool_name
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('tool_registry')
                field: tool_name
      - name: published_at
        data_tests: [not_null]

  - name: stg_pypi__downloads
    description: Deduplicated daily download counts, mirrors excluded.
    columns:
      - name: download_id
        data_tests: [unique, not_null]
      - name: package_name
        data_tests: [not_null]
      - name: download_date
        data_tests: [not_null]
      - name: downloads
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
