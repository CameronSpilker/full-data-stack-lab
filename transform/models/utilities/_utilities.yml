version: 2

models:
  - name: all_days
    description: >
      One row per calendar day, 2000 through 2039. Required by MetricFlow as
      the project's time spine; useful anywhere a query needs to show days on
      which nothing was played.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: The day, at day granularity.
        granularity: day
        data_tests: [not_null, unique]
