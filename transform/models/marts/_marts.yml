version: 2

models:
  - name: mart_team_season
    description: >
      One row per team per season: record, splits, efficiency, four factors,
      Elo, schedule strength, and national and conference ranks on each. The
      table the dashboard's team pages are built from.
    columns:
      - name: team_season_id
        data_tests: [not_null, unique]
      - name: team_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: national_rank
        data_tests: [not_null]
      - name: win_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: adjusted_efficiency_margin
        description: >
          Adjusted points scored minus adjusted points allowed, per 100
          possessions. The single best summary of team quality here.
      - name: made_ncaa_tournament
        description: Whether the team actually played an NCAA tournament game that season.

  - name: mart_game_results
    description: >
      The browsable game log, one row per game, enriched with what Elo and the
      betting market thought before tip-off.
    columns:
      - name: game_id
        data_tests: [not_null, unique]
      - name: season
        data_tests: [not_null]
      - name: home_cover_margin
        description: >
          Home margin plus the closing spread. Positive means the home team
          covered. Null when no line was published.

  - name: mart_elo_timeline
    description: >
      Elo after every game, for charting a season as it happened rather than
      as it finished.
    columns:
      - name: team_game_id
        data_tests: [not_null, unique]
      - name: elo_after
        data_tests: [not_null]

  - name: mart_conference_strength
    description: >
      Conference standing per season, measured on depth rather than on the
      best team in the league.
    columns:
      - name: conference_season_id
        data_tests: [not_null, unique]
      - name: median_efficiency_margin
        description: >
          The median team's rating. A fairer measure of a league than the mean,
          which one outstanding team can carry on its own.

  - name: mart_matchup_odds
    description: >
      Every possible matchup in the current season, priced at a neutral site
      and at home. The tournament simulation draws its probabilities from here,
      so the bracket and any head-to-head view cannot disagree.
    columns:
      - name: matchup_id
        data_tests: [not_null, unique]
      - name: win_probability_neutral
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_bracket
    description: >
      A projected 64-team field: automatic bids to conference tournament
      champions, at-large places to the best remaining teams, seeded S-curve
      across four regions. Replaced by the official bracket once it exists.
    columns:
      - name: bracket_slot_id
        data_tests: [not_null, unique]
      - name: team_id
        data_tests: [not_null, unique]
      - name: seed
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 16
      - name: region_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['East', 'West', 'South', 'Midwest']
      - name: bid_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['automatic', 'at large']

  - name: mart_tournament_odds
    description: >
      Each team's probability of reaching each round, from 20,000 simulated
      tournaments. The dashboard's centrepiece.
    config:
      # Sourced from the project var so the simulation count lives in one
      # place; dbt's Python models read model config rather than vars directly.
      simulations: "{{ var('tournament_simulations') }}"
    columns:
      - name: team_id
        data_tests: [not_null, unique]
      - name: won_championship
        description: Share of simulations this team won the title.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: expected_wins
        description: >
          Expected number of tournament games won — the sum of the per-round
          survival probabilities. Ranks a field better than title odds alone,
          which are dominated by the top few teams.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 6

  - name: mart_model_accuracy
    description: >
      How well each model predicted, by season and game type, with proper
      scoring rules alongside raw accuracy.

      Read `is_point_in_time` first. A false there means the model was allowed
      to see the season it is predicting, and its numbers are not a forecast.
    columns:
      - name: model_season_id
        data_tests: [not_null, unique]
      - name: log_loss
        description: Average surprise in nats. A coin flip scores 0.693; lower is better.
        data_tests: [not_null]
      - name: brier_score
        description: Mean squared error on the probability. A coin flip scores 0.25.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_point_in_time
        data_tests: [not_null]

  - name: mart_model_calibration
    description: >
      Reliability by probability bucket: when a model says 70%, how often does
      it happen? The chart that decides whether the bracket odds can be trusted.
    columns:
      - name: calibration_bucket_id
        data_tests: [not_null, unique]
      - name: observed_win_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_upcoming_games
    description: >
      Every game still to be played this season, priced before it happens: the
      model's pick, how often a real forecast at that confidence has won, and
      where the betting market disagrees. The only table here that is not a
      backtest, and the only one where the whole model is honestly
      point-in-time, because a game nobody has played has no future to leak.
    columns:
      - name: game_id
        data_tests: [not_null, unique]
      - name: as_of_date
        description: >
          The last day a game was played. Everything in this table is dated
          from it rather than from the wall clock, so a stale warehouse says
          what it knows instead of describing a slate its data never reached.
        data_tests: [not_null]
      - name: pick_win_probability
        description: The model's probability for the side it picked, so never below 0.5.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0.5
                  max_value: 1
      - name: edge_vs_market
        description: >
          The model's probability for its pick minus the market's probability
          for the same side. Positive means the model likes a price. Null when
          no book has posted the game, which is most of the schedule.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: -1
                  max_value: 1
      - name: expected_value_per_dollar
        description: >
          What a dollar on the pick returns on average at the posted
          moneyline, using the model's own probability. As good as the
          calibration on the model page and no better.
      - name: days_out
        data_tests: [not_null]
      - name: forecast_basis
        description: >
          The weaker of the two teams' rating bases. `prior_season` means at
          least one side is still being rated on what it carried out of last
          season, which is most of the card in November.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                  values: ['current_season', 'prior_season', 'blended']

  - name: mart_season_status
    description: >
      One row saying which season the site's numbers describe, which season the
      schedule has reached, and whether there is anything left to play. These
      come apart twice a year: every November a new schedule lands weeks before
      anyone plays in it and every results-based model still describes the season
      that finished in April, and every April the last game is played and the
      forecast has nothing left to price. The pages read this so none of them can
      disagree about which season they are showing, or about why a table is
      empty.
    columns:
      - name: season_status_id
        data_tests: [not_null, unique]
      - name: schedule_season
        data_tests: [not_null]
      - name: data_season
        data_tests: [not_null]
      - name: awaited_season
        description: >
          The season the site is waiting on. In the preseason that is the
          schedule the feed has already published; in the offseason no row for
          it exists yet, so it is the one after the last season played. A page
          naming the next season reads this, because `schedule_season` in the
          offseason is the season that just finished.
        data_tests: [not_null]
      - name: is_preseason
        description: >
          The schedule has reached a season nobody has played a game in yet, so
          every page built on results is showing the previous one.
        data_tests: [not_null]
      - name: is_offseason
        description: >
          No fixture is left to play. The season that finished is final and the
          next schedule has not been published, so the forecast is empty because
          there is nothing to forecast rather than because anything failed.
        data_tests: [not_null]
      - name: phase
        description: >
          The column a page switches on, rather than combining the two flags
          itself. `offseason` wins over `preseason`: a schedule for the next
          season arriving is exactly what moves the phase on, and it does so
          with no date written down anywhere.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                  values: ['in_season', 'preseason', 'offseason']
      - name: upcoming_games
        description: >
          Fixtures still ahead of the last result, which is what
          `mart_upcoming_games` prices. Deliberately not the count of unplayed
          fixtures: that bucket also holds games that were postponed or
          cancelled and never played, and counting those would leave the site
          claiming a season is still running months after its final.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  inclusive: true
      - name: unplayed_games
        description: >
          Every fixture on the schedule season's calendar the source has not
          called final, abandoned ones included. Kept beside `upcoming_games`
          because the gap between the two is the count of games that were
          scheduled and never played.
        data_tests: [not_null]
      - name: next_game_date
        description: >
          The first fixture still ahead. Null in the offseason, when there is
          none, which is what the pages check before offering a date.
      - name: last_completed_game_date
        description: >
          The most recent result on the schedule season's calendar. What the
          offseason banner dates itself from, so it reports what the warehouse
          knows rather than what the clock says.

