version: 2

semantic_models:
  - name: ecosystem_growth
    description: >
      Weekly ecosystem metrics per tool. Metrics are defined here rather than
      in the BI tool so every consumer — dashboard, notebook, ad-hoc query —
      computes them the same way.
    model: ref('mart_ecosystem_growth')
    defaults:
      agg_time_dimension: week_start

    entities:
      - name: tool
        type: primary
        expr: tool_name

    dimensions:
      - name: week_start
        type: time
        type_params:
          time_granularity: week
      - name: category
        type: categorical
      - name: repo_full_name
        type: categorical

    measures:
      - name: stars
        description: Total stars at the end of the week.
        agg: sum
      - name: stars_added
        description: Stars gained during the week.
        agg: sum
      - name: star_growth_rate_avg
        description: Mean week-over-week star growth rate.
        expr: star_growth_rate
        agg: average
      - name: weekly_downloads
        description: PyPI downloads during the week, mirrors excluded.
        agg: sum
      - name: download_momentum_avg
        description: Mean week-over-week change in downloads.
        expr: download_momentum
        agg: average
      - name: contributors_added
        description: Net contributors gained during the week.
        agg: sum
      - name: contributor_count
        description: Contributors as of the week.
        agg: max

  - name: release_cadence
    description: Release activity per tool.
    model: ref('mart_release_cadence')
    defaults:
      agg_time_dimension: latest_release_date

    entities:
      - name: tool
        type: primary
        expr: tool_name

    dimensions:
      # `category` is deliberately not repeated here — it is already paired
      # with the `tool` entity on the ecosystem_growth semantic model, and
      # a dimension + primary entity pairing must be unique across the project.
      - name: latest_release_date
        type: time
        type_params:
          time_granularity: day

    measures:
      - name: releases_last_90_days
        description: Releases published in the trailing 90 days.
        agg: sum
      - name: median_days_between_releases_avg
        description: Median gap between releases, averaged across tools.
        expr: median_days_between_releases
        agg: average

metrics:
  - name: weekly_star_growth_rate
    description: Mean week-over-week star growth rate.
    label: Weekly star growth rate
    type: simple
    type_params:
      measure: star_growth_rate_avg

  - name: download_momentum
    description: Mean week-over-week change in PyPI downloads.
    label: Download momentum
    type: simple
    type_params:
      measure: download_momentum_avg

  - name: release_frequency
    description: Releases published in the trailing 90 days.
    label: Release frequency (90d)
    type: simple
    type_params:
      measure: releases_last_90_days

  - name: contributor_growth
    description: Net contributors gained.
    label: Contributor growth
    type: simple
    type_params:
      measure: contributors_added

  - name: stars_per_contributor
    description: >
      Stars per contributor — a rough read on whether attention is outrunning
      the community maintaining the project.
    label: Stars per contributor
    type: ratio
    type_params:
      numerator: total_stars
      denominator: total_contributors

  - name: total_stars
    description: Total stars.
    label: Total stars
    type: simple
    type_params:
      measure: stars

  - name: total_contributors
    description: Contributors as of the latest week.
    label: Total contributors
    type: simple
    type_params:
      measure: contributor_count
