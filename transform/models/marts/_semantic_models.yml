version: 2

# Metrics defined once, in code, so that "efficiency margin" means the same
# thing in the dashboard, in a notebook, and in an ad-hoc query. The
# definitions live beside the marts they read rather than in a BI tool, which
# is the only way they stay under review.

semantic_models:
  - name: team_season
    description: Team performance for a season.
    model: ref('mart_team_season')
    defaults:
      agg_time_dimension: season_start
    entities:
      - name: team
        type: primary
        expr: team_season_id
      - name: franchise
        type: foreign
        expr: team_id
    dimensions:
      - name: season_start
        type: time
        expr: cast(concat(cast(season - 1 as varchar), '-11-01') as date)
        type_params:
          time_granularity: day
      - name: conference_name
        type: categorical
      - name: team_name
        type: categorical
      - name: made_ncaa_tournament
        type: categorical
    measures:
      - name: teams
        description: Count of team seasons.
        agg: count
        expr: team_season_id
      - name: total_wins
        agg: sum
        expr: wins
      - name: total_losses
        agg: sum
        expr: losses
      - name: games_played_total
        agg: sum
        expr: games_played
      - name: sum_efficiency_margin
        agg: sum
        expr: adjusted_efficiency_margin
      - name: sum_tempo
        agg: sum
        expr: adjusted_tempo
      - name: ncaa_tournament_wins_total
        agg: sum
        expr: ncaa_tournament_wins

  - name: game_prediction
    description: One completed game as scored by one model.
    model: ref('int_game_predictions')
    defaults:
      agg_time_dimension: game_date
    entities:
      - name: prediction
        type: primary
        expr: concat(game_id, '-', model_name)
    dimensions:
      - name: game_date
        type: time
        type_params:
          time_granularity: day
      - name: model_name
        type: categorical
      - name: game_type
        type: categorical
      - name: is_point_in_time
        type: categorical
    measures:
      - name: games_predicted
        agg: count
        expr: game_id
      - name: correct_predictions
        agg: sum
        expr: case when (home_win_probability > 0.5) = home_won then 1 else 0 end
      - name: squared_error_total
        agg: sum
        expr: power(home_win_probability - case when home_won then 1.0 else 0.0 end, 2)

metrics:
  # Simple metrics wrap a single measure. The ratio metrics below are built
  # from these rather than from the measures directly, which is what lets a
  # consumer ask for either the numerator or the rate and get consistent
  # answers.
  - name: total_wins
    label: Wins
    type: simple
    type_params:
      measure: total_wins

  - name: total_games
    label: Games played
    type: simple
    type_params:
      measure: games_played_total

  - name: team_seasons
    label: Team seasons
    type: simple
    type_params:
      measure: teams

  - name: efficiency_margin_total
    label: Total efficiency margin
    type: simple
    type_params:
      measure: sum_efficiency_margin

  - name: tempo_total
    label: Total tempo
    type: simple
    type_params:
      measure: sum_tempo

  - name: games_predicted
    label: Games predicted
    type: simple
    type_params:
      measure: games_predicted

  - name: correct_predictions
    label: Correct predictions
    type: simple
    type_params:
      measure: correct_predictions

  - name: squared_error_total
    label: Total squared error
    type: simple
    type_params:
      measure: squared_error_total

  - name: win_rate
    description: Share of games won.
    label: Win rate
    type: ratio
    type_params:
      numerator: total_wins
      denominator: total_games

  - name: average_efficiency_margin
    description: >
      Mean adjusted efficiency margin — points per 100 possessions scored minus
      allowed. The project's headline measure of team quality.
    label: Average efficiency margin
    type: ratio
    type_params:
      numerator: efficiency_margin_total
      denominator: team_seasons

  - name: average_tempo
    description: Mean possessions per team per 40 minutes.
    label: Average tempo
    type: ratio
    type_params:
      numerator: tempo_total
      denominator: team_seasons

  - name: prediction_accuracy
    description: >
      Share of games where the model's favourite won. Read alongside Brier
      score: accuracy alone rewards a model for saying nothing surprising.
    label: Prediction accuracy
    type: ratio
    type_params:
      numerator: correct_predictions
      denominator: games_predicted

  - name: brier_score
    description: >
      Mean squared error of the predicted probability. Lower is better; a coin
      flip on every game scores 0.25.
    label: Brier score
    type: ratio
    type_params:
      numerator: squared_error_total
      denominator: games_predicted
