version: 2

seeds:
  - name: tool_registry
    description: >
      The canonical list of tools this project tracks, generated from
      ingestion/tools.yml. Gives every downstream model a stable dimension to
      join category metadata from.
    config:
      column_types:
        tool_name: varchar
        repo_full_name: varchar
        package_name: varchar
        category: varchar
    columns:
      - name: tool_name
        description: Short slug used as the join key everywhere downstream.
        data_tests:
          - unique
          - not_null
      - name: repo_full_name
        description: GitHub owner/repo.
        data_tests:
          - unique
          - not_null
      - name: package_name
        description: PyPI package name; empty for tools that publish no package.
      - name: category
        description: Bucket used for head-to-head comparisons.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [transformation, orchestration, ingestion, storage, bi]
