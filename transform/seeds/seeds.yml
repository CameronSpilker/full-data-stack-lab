version: 2

seeds:
  - name: team_name_crosswalk
    description: >
      Editorial name differences between Barttorvik's ratings and ESPN's team
      dimension that normalisation cannot resolve mechanically. Only genuine
      exceptions belong here — punctuation, ampersands, and Saint/St. are
      handled by the `normalize_team_name` macro.

      This list is a STARTING POINT written before the first live extract.
      `assert_every_rating_matches_a_team` fails the build with the exact names
      that did not join, which is how the real list gets filled in.
    columns:
      - name: rating_team_name
        description: The name exactly as Barttorvik publishes it.
        data_tests: [not_null, unique]
      - name: espn_team_location
        description: The `location` field on the matching ESPN team.
        data_tests: [not_null]
      - name: note
        description: Why the two disagree. Written for the next person.
