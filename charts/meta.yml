# Folder-level defaults: dbt charts applies this to every board in charts/.
source: warehouse

style:
  # The look is a college basketball broadcast: a navy scoreboard banner on
  # top (templates/court_banner.svg.j2), a pale maple floor under the cards,
  # white cards on it, and condensed capitals for headings and numbers the
  # way a scoreboard sets them. Body text stays a plain sans so a paragraph
  # still reads as a paragraph.
  #
  # Oswald is loaded by scripts/render-charts.sh. Every stack falls back to a
  # narrow face that ships with the reader's system, so a blocked font
  # changes the letterforms and nothing else.
  background: "#f6f0e6"
  muted: "#5f6b7a"
  font:
    color: "#14213d"
  fonts:
    heading:
      family: "'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif"
      weight: 600
      sizes: [30, 20, 16, 14, 12, 12]
    numeral:
      family: "'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif"
      weight: 500
    body:
      family: "Inter, system-ui, sans-serif"

  title:
    font:
      # Titles are drawn exactly as authored. The default is Chicago title
      # case, which fights the house style everywhere else on the site: copy
      # here is plain sentence case, and a heading that renders as "Did the
      # Model Beat the Market?" does not match the page it sits beside. This
      # cascades to chart titles too.
      case: none
      color: "#0c2340"

  charts:
    # A KPI reads like a scoreboard: the number big in the display face, its
    # label small and quiet underneath.
    kpi:
      background: "#ffffff"
      value:
        font:
          extends: numeral
          size: 40
          weight: 600
          color: "#0c2340"
      label:
        font:
          extends: body
          size: 12
          weight: 600

    table:
      background: "#ffffff"

    # Each chart sits on its own white card, which is what lets the floor
    # colour above read as a floor rather than as a tinted page.
    background: "#ffffff"
    border:
      width: 1
      color: "#e4d9c6"
      radius: 12

    # Colour by the job it does, the same way on every board:
    #
    #   Which team, where colour says    the team's own colours: each bar of
    #   nothing else (a list of teams,   a top-N list, both sides of a
    #   two teams compared, the season   matchup, and the rings on the season
    #   scatter)                         scatter, from mart_matchup_odds so a
    #                                    pair that shares a colour gets one
    #                                    side's secondary instead
    #   Everything else: ratings,        blue #2a78d6, and the table ramp
    #   chances, simulation output       #dfebfb #a2c3f0 #83afea. Groups that
    #                                    need telling apart (tiers, models)
    #                                    take the same blue at three depths,
    #                                    #0d366b #2a78d6 #86b6ef
    #   Signed, either side of a         red, grey, blue around the baseline:
    #   baseline (zero, the median)      #fbb2ab #f0efec #a2c3f0 in tables;
    #                                    on bars a `band` column pinned to
    #                                    blue #2a78d6 (good side), grey
    #                                    #898781 (middle or context) and red
    #                                    #e34948 (bad side), with its words
    #                                    in the legend
    #
    # Table ramps stop at mid-tone on purpose. dbt Charts writes cell text in
    # the ink colour whatever the fill, so the darkest step must still read
    # with dark text: each one above clears APCA Lc 55 against #14213d. The
    # survival heatmap has no text in its cells and takes the full blue ramp
    # down to #0d366b.
    #
    # There is one hue for data, blue, so a reader never has to ask what an
    # orange bar means. Grey is the "other" bucket and context; red only ever
    # marks the bad side of a baseline. Team colours never enter the palette:
    # a team's own colours mark only the team.
    color:
      categorical:
        palette: ["#2a78d6", "#0d366b", "#86b6ef", "#898781"]
        single_series_palette: ["#2a78d6"]
      gradient:
        palette: ["#86b6ef", "#5598e7", "#2a78d6", "#1c5cab", "#104281"]
