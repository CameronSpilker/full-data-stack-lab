_schema_version: "0.10.0"  # written automatically by dct migrate
title: The season
notes: >
  Who was good, which conferences carried them, and how the two halves of a
  rating trade off against each other.
tags: [season, teams, conferences]
extends: [./_header.yml]

style:
  charts:
    category_colors:
      # Without a pin the slots fall out alphabetically, which hands the grey
      # to the SEC and a real hue to the catch-all. The grey belongs to
      # "Other": it is the bucket, not a conference.
      conference:
        values:
          Big Ten: "#2a78d6"
          SEC: "#eb6834"
          Big 12: "#1baf7a"
          Other: "#898781"
      # Which side of the average team a conference sits on. The same words
      # and colours as every other signed bar (see meta.yml).
      band:
        values:
          Above average: "#2a78d6"
          Below average: "#e34948"

queries:
  season_kpis:
    notes: One row of headline counts for the latest completed season.
    sql: |
      SELECT
          max(season) AS season,
          count(*) AS teams,
          sum(games_played) / 2 AS games,
          max(adjusted_efficiency_margin) AS best_margin
      FROM marts.mart_team_season
      WHERE season = (SELECT max(season) FROM marts.mart_team_season)

  top_20:
    notes: The top 20 by the model's own rating, not by a poll.
    sql: |
      SELECT
          national_rank,
          team_name,
          conference_name,
          record,
          adjusted_efficiency_margin,
          adjusted_offensive_efficiency,
          adjusted_defensive_efficiency,
          adjusted_tempo,
          elo_rating
      FROM marts.mart_team_season
      WHERE season = (SELECT max(season) FROM marts.mart_team_season)
      ORDER BY national_rank
      LIMIT 20

  top_20_margin:
    notes: Efficiency margin for the top 20, so the gaps are visible rather than ranked away.
    sql: |
      SELECT
          national_rank,
          team_id,
          team_name,
          team_abbreviation,
          team_color,
          conference_name || ' · ' || record AS detail,
          adjusted_efficiency_margin
      FROM marts.mart_team_season
      WHERE season = (SELECT max(season) FROM marts.mart_team_season)
      ORDER BY national_rank
      LIMIT 20

  # Every team, so the shape of the league shows rather than just its top.
  # Conferences past the first three fold into "Other", which is what the
  # fourth palette slot is for.
  offense_defense:
    notes: Offensive against defensive efficiency, one point per team.
    sql: |
      SELECT
          team_name,
          adjusted_offensive_efficiency,
          adjusted_defensive_efficiency,
          adjusted_tempo,
          CASE
              WHEN conference_name IN ('Big Ten', 'SEC', 'Big 12') THEN conference_name
              ELSE 'Other'
          END AS conference
      FROM marts.mart_team_season
      WHERE season = (SELECT max(season) FROM marts.mart_team_season)

  conferences:
    notes: Conference strength for every league that sent a team to the tournament.
    sql: |
      SELECT
          conference_name,
          team_count,
          avg_efficiency_margin,
          teams_in_top_50,
          ncaa_bids,
          ncaa_tournament_wins,
          best_team
      FROM marts.mart_conference_strength
      WHERE season = (SELECT max(season) FROM marts.mart_conference_strength)
      ORDER BY conference_rank
      LIMIT 15

  conference_margin:
    notes: Average efficiency margin by conference, the one-number version of the table.
    sql: |
      SELECT
          conference_name,
          avg_efficiency_margin,
          CASE
              WHEN avg_efficiency_margin >= 0 THEN 'Above average'
              ELSE 'Below average'
          END AS band
      FROM marts.mart_conference_strength
      WHERE season = (SELECT max(season) FROM marts.mart_conference_strength)
      ORDER BY conference_rank
      LIMIT 15

charts:
  banner:
    type: custom
    template: court_banner
    query: season_banner
    style:
      min_height: 132
      max_height: 132
    options:
      current: Season

  kpi_teams:
    query: season_kpis
    type: kpi
    label: Teams rated
    value: teams
    style:
      value:
        format: integer
      label:
        font:
          case: none

  kpi_games:
    query: season_kpis
    type: kpi
    label: Games in the season
    value: games
    style:
      value:
        format: integer
      label:
        font:
          case: none

  kpi_best:
    query: season_kpis
    type: kpi
    label: Best efficiency margin
    value: best_margin
    support:
      value: season
      label: Season
    style:
      value:
        format: "+.1f"
      label:
        font:
          case: none
      support:
        format: "year"

  margin_board:
    query: top_20_margin
    type: custom
    template: team_leaderboard
    title: The top 20, by scoring margin
    subtitle: Adjusted efficiency margin, points per 100 possessions
    x: team_name
    y: adjusted_efficiency_margin
    options:
      team_id: team_id
      abbreviation: team_abbreviation
      team_color: team_color
      rank: national_rank
      detail: detail
      value_format: "+.1f"
    style:
      min_height: 760
      max_height: 760

  quadrant:
    query: offense_defense
    type: scatter
    title: Offence against defence, every team in the country
    subtitle: Up and to the right is good. The defensive axis runs downward, because points allowed is a number to minimise.
    x: adjusted_offensive_efficiency
    y: adjusted_defensive_efficiency
    color: conference
    x_label: Points scored per 100 possessions
    y_label: Points allowed per 100 possessions
    height: 520
    style:
      axis_x:
        scale:
          continuous:
            zero: false
            domain: [84, 136]
      axis_y:
        scale:
          continuous:
            # Descending on purpose: defensive efficiency is points allowed,
            # so putting the low numbers at the top makes "up and to the
            # right" mean good on both axes.
            domain: [128, 86]
        labels:
          format: ".0f"

  conference_bars:
    query: conference_margin
    type: bar
    title: Which league was actually deep
    subtitle: Average efficiency margin across every team in the conference
    x: conference_name
    y: avg_efficiency_margin
    # Signed around zero, the average team, so the side of zero is the colour.
    color: band
    sort: { by: avg_efficiency_margin, order: desc }
    height: 460
    style:
      orientation: horizontal
      axis_y:
        labels:
          format: "+.1f"

  conference_table:
    query: conferences
    type: table
    title: Conference by conference
    subtitle: Ordered by the model's conference rank
    style:
      columns:
        conference_name:
          label: Conference
        team_count:
          label: Teams
          format: integer
          align: right
        avg_efficiency_margin:
          label: Avg margin
          format: "+.1f"
          align: right
          scale:
            background:
              palette: ["#fbb2ab", "#f0efec", "#a2c3f0"]
              hinge: 0
              arm_mode: symmetric
              domain: data
        teams_in_top_50:
          label: Top 50
          format: integer
          align: right
        ncaa_bids:
          label: Bids
          format: integer
          align: right
        ncaa_tournament_wins:
          label: Wins
          format: integer
          align: right
        best_team:
          label: Best team

  top_20_table:
    query: top_20
    type: table
    title: The top 20
    subtitle: Ranked by the model, which has never watched a game
    style:
      columns:
        national_rank:
          label: "#"
          format: integer
          align: right
          width: 60
        team_name:
          label: Team
        conference_name:
          label: Conference
        record:
          label: Record
          align: right
        adjusted_efficiency_margin:
          label: Margin
          format: "+.1f"
          align: right
          scale:
            background:
              palette: ["#dfebfb", "#a2c3f0", "#83afea"]
              domain: data
        adjusted_offensive_efficiency:
          label: Offence
          format: ".1f"
          align: right
        adjusted_defensive_efficiency:
          label: Defence
          format: ".1f"
          align: right
        adjusted_tempo:
          label: Tempo
          format: ".1f"
          align: right
        elo_rating:
          label: Elo
          format: ",.0f"
          align: right

rows:
  # The header: the court banner from _header.yml, with the bar of buttons
  # in it. This board's button is the one named in charts.banner.
  - banner
  # What this page gets you, on its own line under the banner.
  - text: |
      Who was good, which conferences were deep, and how the two halves of a
      rating trade off against each other.
  - text: |
      Everything here describes the last completed season. A team that has not
      played cannot be rated, so the board waits for games rather than drawing
      an empty axis.
  - cols: [kpi_teams, kpi_games, kpi_best]
  - cols: [margin_board, quadrant]
  - cols: [top_20_table]
  - title: Conferences
    text: |
      A conference is only as strong as the teams nobody talks about. Bids
      reward the top of a league; average efficiency margin measures the whole
      of it, and the two disagree more often than the bracket suggests.
    cols: [conference_bars]
  - cols: [conference_table]
