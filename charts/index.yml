_schema_version: "0.10.0"  # written automatically by dct migrate
title: Full Data Stack Lab · charts
notes: >
  The landing board. Three headline numbers, one chart worth arriving for, and
  the way into the three boards that carry the detail.
tags: [overview]
extends: [./_header.yml]
aliases:
  - /charts

queries:
  headline:
    notes: One row of numbers describing the latest completed season.
    sql: |
      SELECT
          max(season) AS season,
          count(*) AS teams,
          sum(games_played) / 2 AS games
      FROM marts.mart_team_season
      WHERE season = (SELECT max(season) FROM marts.mart_team_season)

  best_model:
    notes: The best-calibrated honest forecast in the latest season.
    sql: |
      SELECT
          accuracy,
          brier_score,
          games_scored
      FROM marts.mart_model_accuracy
      WHERE game_type = 'regular_season'
        AND is_point_in_time
        AND season = (SELECT max(season) FROM marts.mart_model_accuracy)
      ORDER BY brier_score
      LIMIT 1

  # Elo's whole history in one line: the number the lab exists to move.
  elo_history:
    notes: Point-in-time regular-season accuracy, season by season.
    sql: |
      SELECT
          CAST(season AS VARCHAR) AS season,
          accuracy,
          games_scored
      FROM marts.mart_model_accuracy
      WHERE model_name = 'elo_pregame'
        AND game_type = 'regular_season'
      ORDER BY season

  top_10:
    notes: The ten teams the model rated highest in the latest season.
    sql: |
      SELECT
          national_rank,
          team_id,
          team_name,
          team_abbreviation,
          team_color,
          team_secondary_color,
          conference_name || ' · ' || record AS detail,
          adjusted_efficiency_margin
      FROM marts.mart_team_season
      WHERE season = (SELECT max(season) FROM marts.mart_team_season)
      ORDER BY national_rank
      LIMIT 10

charts:
  banner:
    type: custom
    template: court_banner
    query: season_banner
    style:
      min_height: 132
      max_height: 132
    options:
      current: Home

  kpi_season:
    query: headline
    type: kpi
    label: Season
    value: season
    style:
      value:
        format: year
      label:
        font:
          case: none

  kpi_games:
    query: headline
    type: kpi
    label: Games modelled
    value: games
    style:
      value:
        format: integer
      label:
        font:
          case: none

  kpi_accuracy:
    query: best_model
    type: kpi
    label: Best honest forecast
    value: accuracy
    support:
      value: brier_score
      label: Brier score
    style:
      value:
        format: percent_whole
      label:
        font:
          case: none
      support:
        format: ".3f"

  elo_trend:
    query: elo_history
    type: line
    title: The number the lab exists to move
    subtitle: Elo's regular-season accuracy, scored only on games it had not seen
    x: season
    y: accuracy
    y_label: Accuracy
    height: 360
    style:
      legend:
        visible: false
      axis_y:
        scale:
          continuous:
            # Auto-scaling a 1.5-point range draws a cliff. The window is wide
            # enough that a real move looks like one and noise does not.
            domain: [0.66, 0.78]
        labels:
          format: ".0%"

  # A leaderboard rather than a table: the crest and the bar say "who" and
  # "how far ahead" before a reader gets to the numbers.
  top_10_board:
    query: top_10
    type: custom
    template: team_leaderboard
    title: The top ten
    subtitle: By adjusted efficiency margin, which is the model's own opinion
    x: team_name
    y: adjusted_efficiency_margin
    options:
      team_id: team_id
      abbreviation: team_abbreviation
      team_color: team_color
      rank: national_rank
      detail: detail
      value_format: "+.1f"
      team_bars: true
      secondary_color: team_secondary_color
    style:
      min_height: 470
      max_height: 470

rows:
  # The header: the court banner from _header.yml, with the bar of buttons
  # in it. This board's button is the one named in charts.banner.
  - banner
  # What this page gets you, on its own line under the banner.
  - text: |
      Headline numbers for the latest season, and the way into the six
      boards that carry the detail.
  - cols: [kpi_season, kpi_games, kpi_accuracy]
  - cols: [top_10_board, elo_trend]
  # Each board's description now sits under the bar on the board itself, so
  # there is no list of them here. What is left is how the boards are built,
  # which is worth saying once and is not what a reader came to the page for:
  # the numbers go above it.
  - style:
      text:
        column:
          max_number: 1
    text: |
      These boards are YAML. Each one is a file in the same repository as the
      dbt models it reads, so a chart and the column behind it change in one
      commit and get reviewed together.

      The data comes from public APIs into Parquet, through DuckDB and dbt,
      on a nightly Dagster schedule. The
      [dbt docs](https://lab.cameronspilker.com/docs/) show every model
      these boards read and how it is built.

      Built with [dbt Charts](https://dbtcharts.com). The source for every
      board is in
      [full-data-stack-lab](https://github.com/CameronSpilker/full-data-stack-lab/tree/main/charts).
