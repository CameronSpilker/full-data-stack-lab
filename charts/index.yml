_schema_version: "0.10.0"  # written automatically by dct migrate
title: Full Data Stack Lab · charts
notes: >
  The landing board. Three headline numbers, one chart worth arriving for, and
  the way into the three boards that carry the detail.
tags: [overview]
extends: [./_header.yml]
aliases:
  - /charts

queries:
  headline:
    notes: One row of numbers describing the latest completed season.
    sql: |
      SELECT
          CAST(max(season) - 1 AS VARCHAR) || '-' || right(CAST(max(season) AS VARCHAR), 2)
              AS season,
          count(*) AS teams,
          sum(games_played) / 2 AS games
      FROM marts.mart_team_season
      WHERE season = (SELECT coalesce(try_cast({{ season }} AS INTEGER), max(season)) FROM marts.mart_team_season)

  best_model:
    notes: The best-calibrated honest forecast in the latest season.
    sql: |
      SELECT
          accuracy,
          brier_score,
          games_scored
      FROM marts.mart_model_accuracy
      WHERE game_type = 'regular_season'
        AND is_point_in_time
        AND season = (SELECT coalesce(try_cast({{ season }} AS INTEGER), max(season)) FROM marts.mart_model_accuracy)
      ORDER BY brier_score
      LIMIT 1

  # Elo's accuracy in the two seasons the boards offer, the same pair as the
  # banner's season switch. Older seasons are in the mart (the model board
  # has them), but here they only pushed the season being played off to the
  # side. Each label carries its game count, because a season a week old is
  # scored on a few hundred games and its number moves a long way.
  elo_history:
    notes: Point-in-time regular-season accuracy in the two seasons on offer.
    sql: |
      SELECT
          CAST(season - 1 AS VARCHAR) || '-' || right(CAST(season AS VARCHAR), 2)
              || ' · ' || format('{:,}', games_scored) || ' games' AS season,
          accuracy,
          games_scored
      FROM marts.mart_model_accuracy
      WHERE model_name = 'elo_pregame'
        AND game_type = 'regular_season'
        AND season IN (
            SELECT DISTINCT season FROM marts.mart_team_season
            ORDER BY season DESC
            LIMIT 2
        )
      ORDER BY season

  top_10:
    notes: The ten teams the model rated highest in the latest season.
    sql: |
      SELECT
          national_rank,
          team_id,
          team_name,
          team_abbreviation,
          team_color,
          team_secondary_color,
          conference_name || ' · ' || record AS detail,
          adjusted_efficiency_margin
      FROM marts.mart_team_season
      WHERE season = (SELECT coalesce(try_cast({{ season }} AS INTEGER), max(season)) FROM marts.mart_team_season)
      ORDER BY national_rank
      LIMIT 10

charts:
  banner:
    type: custom
    template: court_banner
    query: season_banner
    style:
      min_height: 132
      max_height: 132
    options:
      current: Home

  kpi_season:
    query: headline
    type: kpi
    label: Season
    value: season
    style:
      label:
        font:
          case: none

  kpi_games:
    query: headline
    type: kpi
    label: Games modelled
    value: games
    style:
      value:
        format: integer
      label:
        font:
          case: none

  kpi_accuracy:
    query: best_model
    type: kpi
    label: Best honest forecast
    value: accuracy
    support:
      value: brier_score
      label: Brier score
    style:
      value:
        format: percent_whole
      label:
        font:
          case: none
      support:
        format: ".3f"

  # Two bars from zero rather than a line: with two seasons there is no trend
  # to draw, and a bar cannot run off its own axis the way an early-season
  # point did against a window cut to fit the history.
  elo_trend:
    query: elo_history
    type: bar
    title: The number the lab exists to move
    subtitle: Elo's regular-season accuracy on games it had not seen
    x: season
    y: accuracy
    y_label: Accuracy
    height: 360
    style:
      orientation: vertical
      legend:
        visible: false
      axis_y:
        scale:
          continuous:
            domain: [0, 1]
        labels:
          format: ".0%"
      marks:
        bar:
          labels:
            visible: true
            position: above
            format: ".1%"

  # A leaderboard rather than a table: the crest and the bar say "who" and
  # "how far ahead" before a reader gets to the numbers.
  top_10_board:
    query: top_10
    type: custom
    template: team_leaderboard
    title: The top ten
    subtitle: By adjusted efficiency margin
    x: team_name
    y: adjusted_efficiency_margin
    options:
      team_id: team_id
      abbreviation: team_abbreviation
      team_color: team_color
      rank: national_rank
      detail: detail
      value_format: "+.1f"
      team_bars: true
      secondary_color: team_secondary_color
    style:
      min_height: 470
      max_height: 470

rows:
  # The header: the court banner from _header.yml, with the bar of buttons
  # in it. This board's button is the one named in charts.banner.
  - banner
  # One short line saying what the page is. The charts carry the rest.
  - text: |
      This season's headline numbers. The buttons above go to the detail.
  - cols: [kpi_season, kpi_games, kpi_accuracy]
  - cols: [top_10_board, elo_trend]
  - text: |
      Built with [dbt Charts](https://dbtcharts.com) ·
      [source](https://github.com/CameronSpilker/full-data-stack-lab/tree/main/charts) ·
      [dbt docs](https://lab.cameronspilker.com/docs/)
