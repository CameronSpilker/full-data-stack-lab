_schema_version: "0.10.0"  # written automatically by dct migrate
title: Full Data Stack Lab · charts
notes: >
  The landing board. Three headline numbers, one chart worth arriving for, and
  the way into the three boards that carry the detail.
tags: [overview]
extends: [./_header.yml]
aliases:
  - /charts

# The season picker. Under `dct serve`, and on the live boards, it is a
# dropdown and a URL parameter (?season=2025-26). Its default is "Latest",
# which every query resolves to the newest season with ratings, so the
# default moves on by itself when a new season is rated. The value is the
# label itself, and queries read the year off its last two digits, which also
# makes ?season=2026 work. The static export draws the default.
variables:
  season:
    input: select
    notes: The season every chart on the board describes.
    options:
      query: season_options
      column: season_key
    default: Latest
    required: true

queries:
  season_options:
    notes: Every season with ratings, newest first, behind a "Latest" choice.
    sql: |
      SELECT season_key
      FROM (
          SELECT 'Latest' AS season_key, 9999 AS sort_key
          UNION ALL
          SELECT
              CAST(season - 1 AS VARCHAR) || '-' || right(CAST(season AS VARCHAR), 2),
              season
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
          GROUP BY season
      )
      ORDER BY sort_key DESC

  picked_banner:
    notes: The banner's line for the picked season, in place of the shared one.
    sql: |
      WITH picked AS (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season)) AS season
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )
      SELECT
          CAST(picked.season - 1 AS VARCHAR) || '-' || right(CAST(picked.season AS VARCHAR), 2)
              AS season_label,
          CASE
              WHEN status.phase = 'in_season' AND status.data_season = picked.season
                  THEN 'in progress'
              ELSE 'final'
          END AS phase_label,
          strftime(max(games.game_date), '%b %-d, %Y') AS last_game
      FROM picked
      CROSS JOIN marts.mart_season_status AS status
      LEFT JOIN marts.mart_game_results AS games
          ON games.season = picked.season AND games.is_completed
      GROUP BY picked.season, status.phase, status.data_season

  headline:
    notes: One row of numbers describing the latest completed season.
    sql: |
      SELECT
          max(season) AS season,
          count(*) AS teams,
          sum(games_played) / 2 AS games
      FROM marts.mart_team_season
      WHERE season = (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season))
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )

  best_model:
    notes: The best-calibrated honest forecast in the latest season.
    sql: |
      SELECT
          accuracy,
          brier_score,
          games_scored
      FROM marts.mart_model_accuracy
      WHERE game_type = 'regular_season'
        AND is_point_in_time
        AND season = (SELECT max(season) FROM marts.mart_model_accuracy)
      ORDER BY brier_score
      LIMIT 1

  # Elo's whole history in one line: the number the lab exists to move.
  elo_history:
    notes: Point-in-time regular-season accuracy, season by season.
    sql: |
      SELECT
          CAST(season AS VARCHAR) AS season,
          accuracy,
          games_scored
      FROM marts.mart_model_accuracy
      WHERE model_name = 'elo_pregame'
        AND game_type = 'regular_season'
      ORDER BY season

  top_10:
    notes: The ten teams the model rated highest in the latest season.
    sql: |
      SELECT
          national_rank,
          team_id,
          team_name,
          team_abbreviation,
          team_color,
          team_secondary_color,
          conference_name || ' · ' || record AS detail,
          adjusted_efficiency_margin
      FROM marts.mart_team_season
      WHERE season = (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season))
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )
      ORDER BY national_rank
      LIMIT 10

charts:
  banner:
    type: custom
    template: court_banner
    query: picked_banner
    style:
      min_height: 132
      max_height: 132
    options:
      current: Home

  kpi_season:
    query: headline
    type: kpi
    value: season
    style:
      value:
        format: year
      label:
        font:
          case: none

  kpi_games:
    query: headline
    type: kpi
    label: Games modelled
    value: games
    style:
      value:
        format: integer
      label:
        font:
          case: none

  kpi_accuracy:
    query: best_model
    type: kpi
    label: Best honest forecast
    value: accuracy
    support:
      value: brier_score
      label: Brier score
    style:
      value:
        format: percent_whole
      label:
        font:
          case: none
      support:
        format: ".3f"

  elo_trend:
    query: elo_history
    type: line
    title: The number the lab exists to move
    subtitle: Regular-season accuracy on games it had not seen
    x: season
    y: accuracy
    y_label: Accuracy
    height: 360
    style:
      legend:
        visible: false
      axis_y:
        scale:
          continuous:
            # Auto-scaling a 1.5-point range draws a cliff. The window is wide
            # enough that a real move looks like one and noise does not.
            domain: [0.66, 0.78]
        labels:
          format: ".0%"

  # A leaderboard rather than a table: the crest and the bar say "who" and
  # "how far ahead" before a reader gets to the numbers.
  top_10_board:
    query: top_10
    type: custom
    template: team_leaderboard
    title: The top ten
    subtitle: By adjusted efficiency margin
    x: team_name
    y: adjusted_efficiency_margin
    options:
      team_id: team_id
      abbreviation: team_abbreviation
      team_color: team_color
      rank: national_rank
      detail: detail
      value_format: "+.1f"
      team_bars: true
      secondary_color: team_secondary_color
    style:
      min_height: 470
      max_height: 470

rows:
  # The header: the court banner from _header.yml, with the bar of buttons
  # in it. This board's button is the one named in charts.banner.
  - banner
  # One short line saying what the page is. The charts carry the rest.
  - text: |
      This season's headline numbers. The buttons above go to the detail.
  - cols: [kpi_season, kpi_games, kpi_accuracy]
  - cols: [top_10_board, elo_trend]
  - text: |
      Built with [dbt Charts](https://dbtcharts.com) ·
      [source](https://github.com/CameronSpilker/full-data-stack-lab/tree/main/charts) ·
      [dbt docs](https://lab.cameronspilker.com/docs/)
