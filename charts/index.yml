title: Full Data Stack Lab · charts
notes: >
  The landing board. Three headline numbers, one chart worth arriving for, and
  the way into the three boards that carry the detail.
tags: [overview]
aliases:
  - /charts

queries:
  headline:
    notes: One row of numbers describing the latest completed season.
    sql: |
      SELECT
          max(season) AS season,
          count(*) AS teams,
          sum(games_played) / 2 AS games
      FROM marts.mart_team_season
      WHERE season = (SELECT max(season) FROM marts.mart_team_season)

  best_model:
    notes: The best-calibrated honest forecast in the latest season.
    sql: |
      SELECT
          accuracy,
          brier_score,
          games_scored
      FROM marts.mart_model_accuracy
      WHERE game_type = 'regular_season'
        AND is_point_in_time
        AND season = (SELECT max(season) FROM marts.mart_model_accuracy)
      ORDER BY brier_score
      LIMIT 1

  # Elo's whole history in one line: the number the lab exists to move.
  elo_history:
    notes: Point-in-time regular-season accuracy, season by season.
    sql: |
      SELECT
          CAST(season AS VARCHAR) AS season,
          accuracy,
          games_scored
      FROM marts.mart_model_accuracy
      WHERE model_name = 'elo_pregame'
        AND game_type = 'regular_season'
      ORDER BY season

  top_10:
    notes: The ten teams the model rated highest in the latest season.
    sql: |
      SELECT
          national_rank,
          team_name,
          conference_name,
          record,
          adjusted_efficiency_margin
      FROM marts.mart_team_season
      WHERE season = (SELECT max(season) FROM marts.mart_team_season)
      ORDER BY national_rank
      LIMIT 10

charts:
  kpi_season:
    query: headline
    type: kpi
    label: Season
    value: season
    style:
      value:
        format: year
      label:
        font:
          case: none

  kpi_games:
    query: headline
    type: kpi
    label: Games modelled
    value: games
    style:
      value:
        format: integer
      label:
        font:
          case: none

  kpi_accuracy:
    query: best_model
    type: kpi
    label: Best honest forecast
    value: accuracy
    support:
      value: brier_score
      label: Brier score
      format: ".3f"
    style:
      value:
        format: percent_whole
      label:
        font:
          case: none

  elo_trend:
    query: elo_history
    type: line
    title: The number the lab exists to move
    subtitle: Elo's regular-season accuracy, scored only on games it had not seen
    x: season
    y: accuracy
    y_label: Accuracy
    height: 360
    style:
      number_format: ".0%"
      legend:
        visible: false
      axis_y:
        scale:
          continuous:
            # Auto-scaling a 1.5-point range draws a cliff. The window is wide
            # enough that a real move looks like one and noise does not.
            domain: [0.66, 0.78]

  top_10_table:
    query: top_10
    type: table
    title: The top ten
    subtitle: By adjusted efficiency margin, which is the model's own opinion
    style:
      columns:
        national_rank:
          label: "#"
          format: integer
          align: right
          width: 60
        team_name:
          label: Team
        conference_name:
          label: Conference
        record:
          label: Record
          align: right
        adjusted_efficiency_margin:
          label: Margin
          format: "+.1f"
          align: right
          scale:
            background:
              palette: ["#86b6ef", "#2a78d6", "#104281"]
              domain: data

rows:
  # The top bar, and under it the one line that says what this page gets you.
  # Both sit in the same card, so the description reads as part of the bar
  # rather than as the first paragraph of the page. Every board carries the
  # same eight buttons in the same order, and the button for the page you are
  # on is filled in rather than linked. Each file writes the two button styles
  # once and anchors the rest to them, so a restyle is one edit per file
  # instead of eight.
  - style:
      padding: 4
      gap: 4
      background: dbt-grays.surface-subtle
      border:
        width: 1
        color: dbt-grays.border
        radius: 10
    rows:
      - cols:
        - width: "12.4%"
          text: "Charts home"
          style: &nav_current
            padding: 6
            background: "category[1]"
            font:
              color: dbt-grays.canvas
            border:
              width: 1
              color: "category[1]"
              radius: 8
            text:
              align: center
        - width: "12.4%"
          text: "[Rankings](/charts/rankings/)"
          style: &nav_button
            padding: 6
            background: dbt-grays.canvas
            border:
              width: 1
              color: dbt-grays.border
              radius: 8
            text:
              align: center
        - width: "12.4%"
          text: "[Scorecard](/charts/scorecard/)"
          style: *nav_button
        - width: "12.4%"
          text: "[Matchup](/charts/matchup/)"
          style: *nav_button
        - width: "12.4%"
          text: "[Model](/charts/model/)"
          style: *nav_button
        - width: "12.4%"
          text: "[Season](/charts/season/)"
          style: *nav_button
        - width: "12.4%"
          text: "[Tournament](/charts/tournament/)"
          style: *nav_button
        - width: "12.4%"
          text: "[Dashboard](/)"
          style: *nav_button
      - text: |
          Headline numbers for the latest season, and the way into the six
          boards that carry the detail.
        style:
          padding: 8
          background: dbt-grays.surface-subtle
          border:
            width: 0
  - cols: [kpi_season, kpi_games, kpi_accuracy]
  - cols: [elo_trend, top_10_table]
  # Each board's description now sits under the bar on the board itself, so
  # there is no list of them here. What is left is how the boards are built,
  # which is worth saying once and is not what a reader came to the page for:
  # the numbers go above it.
  - style:
      text:
        column:
          max_number: 1
    text: |
      These boards are YAML. Each one is a file in the same repository as the
      dbt models it reads, so a chart and the column behind it change in one
      commit and get reviewed together.

      The pipeline is the same one behind the Evidence dashboard, which the
      last button above goes to: public APIs into Parquet, DuckDB and dbt in
      the middle, Dagster on a nightly schedule. These pages are a second
      opinion on the presentation layer, not a second pipeline.

      Built with [dbt Charts](https://dbtcharts.com). The source for every
      board is in
      [full-data-stack-lab](https://github.com/CameronSpilker/full-data-stack-lab/tree/main/charts).
