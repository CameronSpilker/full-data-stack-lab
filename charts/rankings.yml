_schema_version: "0.10.0"  # written automatically by dct migrate
title: The rankings
notes: >
  The whole Division I field in rating order, and the same field plotted
  offence against defence so the shape of a team is readable next to its
  place in the order.
tags: [season, teams, rankings]
extends: [./_header.yml]

style:
  charts:
    category_colors:
      # The tier is the category here, so the slots are pinned to it rather
      # than left to fall out alphabetically. Tiers are ordered, so they are
      # one blue ramp from the validated sequential steps, darkest at the top,
      # rather than three unrelated hues, spread as far apart in lightness as
      # the ramp goes (700, 450, 250) so the three read apart as a scatter's
      # thin rings. The grey belongs to "The rest": it is the bucket every
      # team not in the conversation lands in, and it is lighter than the
      # palette's grey so the blues stand out of it. Hex rather than `category[n]`, because
      # those tokens resolve against dbt Charts' built-in theme, not the
      # palette meta.yml sets.
      tier:
        values:
          Title favourites: "#0d366b"
          Final four potential: "#2a78d6"
          Hit or miss: "#86b6ef"
          The rest: "#b4b1aa"

# The season picker. Under `dct serve`, and on the live boards, it is a
# dropdown and a URL parameter (?season=2025-26). Its default is "Latest",
# which every query resolves to the newest season with ratings, so the
# default moves on by itself when a new season is rated. The value is the
# label itself, and queries read the year off its last two digits, which also
# makes ?season=2026 work. The static export draws the default.
variables:
  season:
    input: select
    notes: The season every chart on the board describes.
    options:
      query: season_options
      column: season_key
    default: Latest
    required: true

queries:
  season_options:
    notes: Every season with ratings, newest first, behind a "Latest" choice.
    sql: |
      SELECT season_key
      FROM (
          SELECT 'Latest' AS season_key, 9999 AS sort_key
          UNION ALL
          SELECT
              CAST(season - 1 AS VARCHAR) || '-' || right(CAST(season AS VARCHAR), 2),
              season
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
          GROUP BY season
      )
      ORDER BY sort_key DESC

  picked_banner:
    notes: The banner's line for the picked season, in place of the shared one.
    sql: |
      WITH picked AS (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season)) AS season
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )
      SELECT
          CAST(picked.season - 1 AS VARCHAR) || '-' || right(CAST(picked.season AS VARCHAR), 2)
              AS season_label,
          CASE
              WHEN status.phase = 'in_season' AND status.data_season = picked.season
                  THEN 'in progress'
              ELSE 'final'
          END AS phase_label,
          strftime(max(games.game_date), '%b %-d, %Y') AS last_game
      FROM picked
      CROSS JOIN marts.mart_season_status AS status
      LEFT JOIN marts.mart_game_results AS games
          ON games.season = picked.season AND games.is_completed
      GROUP BY picked.season, status.phase, status.data_season

  # The tiers are cut on national rank rather than on an efficiency number.
  # Cutting on margin reads better, because the bands are the diagonals a
  # reader already sees on the quadrant, but it hard-codes the spread of one
  # season's ratings, and the synthetic seasons the demo pipeline builds are
  # far narrower than a real one. A rank cut is the same diagonal, drawn
  # where the field actually sits.
  field:
    notes: Every team in the latest season, tiered and ordered by the model's rating.
    sql: |
      SELECT
          national_rank,
          team_name,
          conference_name,
          record,
          adjusted_efficiency_margin,
          adjusted_offensive_efficiency,
          adjusted_defensive_efficiency,
          adjusted_tempo,
          offense_rank,
          defense_rank,
          elo_rating,
          made_ncaa_tournament,
          CASE
              WHEN national_rank <= 16 THEN 'Title favourites'
              WHEN national_rank <= 48 THEN 'Final four potential'
              WHEN national_rank <= 100 THEN 'Hit or miss'
              ELSE 'The rest'
          END AS tier
      FROM marts.mart_team_season
      WHERE season = (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season))
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )
      ORDER BY national_rank

  # The same field for the scatter, worst first, so the top tiers are drawn
  # last and sit on top of the cloud rather than under it.
  field_points:
    notes: Every team as a point, tiered, the best drawn last.
    sql: |
      SELECT
          team_id,
          team_name,
          adjusted_offensive_efficiency,
          adjusted_defensive_efficiency,
          CASE
              WHEN national_rank <= 16 THEN 'Title favourites'
              WHEN national_rank <= 48 THEN 'Final four potential'
              WHEN national_rank <= 100 THEN 'Hit or miss'
              ELSE 'The rest'
          END AS tier,
          -- The tiers that matter drawn larger, so they read out of the cloud.
          CASE
              WHEN national_rank <= 16 THEN 13
              WHEN national_rank <= 48 THEN 11
              WHEN national_rank <= 100 THEN 9.5
              ELSE 8
          END AS point_radius
      FROM marts.mart_team_season
      WHERE season = (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season))
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )
      ORDER BY national_rank DESC

  top_25:
    notes: The top of the order, at a length where one row per team is still readable.
    sql: |
      WITH tiered AS (
          SELECT
              *,
              CASE
                  WHEN national_rank <= 16 THEN 'Title favourites'
                  WHEN national_rank <= 48 THEN 'Final four potential'
                  WHEN national_rank <= 100 THEN 'Hit or miss'
                  ELSE 'The rest'
              END AS tier
          FROM marts.mart_team_season
          WHERE season = (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season))
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )
      )
      SELECT
          national_rank,
          team_id,
          team_name,
          team_abbreviation,
          team_color,
          conference_name || ' · ' || record || ' · ' || tier AS detail,
          adjusted_efficiency_margin,
          tier
      FROM tiered
      ORDER BY national_rank
      LIMIT 25

  tier_counts:
    notes: How many teams each tier holds, and how good the tier is on average.
    sql: |
      WITH tiered AS (
          SELECT
              CASE
                  WHEN national_rank <= 16 THEN 'Title favourites'
                  WHEN national_rank <= 48 THEN 'Final four potential'
                  WHEN national_rank <= 100 THEN 'Hit or miss'
                  ELSE 'The rest'
              END AS tier,
              adjusted_efficiency_margin,
              adjusted_offensive_efficiency,
              adjusted_defensive_efficiency
          FROM marts.mart_team_season
          WHERE season = (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season))
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )
      )
      SELECT
          tier,
          count(*) AS teams,
          avg(adjusted_efficiency_margin) AS avg_margin,
          avg(adjusted_offensive_efficiency) AS avg_offense,
          avg(adjusted_defensive_efficiency) AS avg_defense
      FROM tiered
      GROUP BY tier
      ORDER BY avg_margin DESC

  headline:
    notes: One row describing the field being ranked.
    sql: |
      SELECT
          count(*) AS teams,
          max(adjusted_efficiency_margin) AS best_margin,
          count(*) FILTER (WHERE national_rank <= 16) AS favourites
      FROM marts.mart_team_season
      WHERE season = (
          SELECT coalesce(try_cast('20' || right({{ season }}, 2) AS INTEGER), max(season))
          FROM marts.mart_team_season
          WHERE adjusted_efficiency_margin IS NOT NULL
      )

charts:
  banner:
    type: custom
    template: court_banner
    query: picked_banner
    style:
      min_height: 132
      max_height: 132
    options:
      current: Rankings

  kpi_teams:
    query: headline
    type: kpi
    label: Teams ranked
    value: teams
    style:
      value:
        format: integer
      label:
        font:
          case: none

  kpi_best:
    query: headline
    type: kpi
    label: Best rating in the field
    value: best_margin
    support:
      value: favourites
      label: Teams in the top tier
    style:
      value:
        format: "+.1f"
      label:
        font:
          case: none
      support:
        format: "integer"

  # The top of the field as a leaderboard: the crest says who, the bar how
  # far ahead, and the bar's colour which tier the cut put the team in.
  order_board:
    query: top_25
    type: custom
    template: team_leaderboard
    title: The top 25, in order
    subtitle: Points per 100 possessions above an average team, coloured by tier
    x: team_name
    y: adjusted_efficiency_margin
    color: tier
    options:
      team_id: team_id
      abbreviation: team_abbreviation
      team_color: team_color
      rank: national_rank
      detail: detail
      value_format: "+.1f"
    style:
      min_height: 1100
      max_height: 1100

  # Each team is its logo, ringed in its tier's colour (templates/team_scatter).
  quadrant:
    query: field_points
    title: Every team in the country, offence against defence
    subtitle: Up and to the right is better. Hover a logo for the team.
    type: custom
    template: team_scatter
    x: adjusted_offensive_efficiency
    y: adjusted_defensive_efficiency
    color: tier
    options:
      team_id: team_id
      team_name: team_name
      # The window is the same on the season board's quadrant, so the two
      # plots read against each other. Defence runs downward because points
      # allowed is a number to minimise: up and to the right is good on both.
      x_min: 80
      x_max: 140
      y_min: 80
      y_max: 130
      radius_column: point_radius
      y_reverse: true
      x_label: Points scored per 100 possessions
      y_label: Points allowed per 100 possessions
    style:
      min_height: 600
      max_height: 600

  tier_table:
    query: tier_counts
    type: table
    title: What each tier looks like
    subtitle: Tiers are cuts on rank
    style:
      columns:
        tier:
          label: Tier
        teams:
          label: Teams
          format: integer
          align: right
        avg_margin:
          label: Avg margin
          format: "+.1f"
          align: right
        avg_offense:
          label: Avg offence
          format: ".1f"
          align: right
        avg_defense:
          label: Avg defence
          format: ".1f"
          align: right

  full_table:
    query: field
    type: table
    title: The full field
    subtitle: Every ranked team, in order
    style:
      pagination:
        enabled: true
        # Pinned rather than auto-fitted. A static export pre-renders at
        # most 20 pages, and auto-fitting a 376-team field gave 18 rows a
        # page, which is 21 pages: the last teams in the country were
        # silently dropped from a table titled "the full field". 22 is the
        # whole field in 18 pages, so every team is in the file.
        #
        # The render still warns that the tile shows 20 of those 22 rows
        # without scrolling. That is worth leaving: it costs a reader two
        # rows of scroll, where a page size small enough to silence it goes
        # back over the 20-page cap and drops teams instead.
        page_rows: 22
      columns:
        national_rank:
          label: "#"
          format: integer
          align: right
          width: 60
        team_name:
          label: Team
        conference_name:
          label: Conference
        tier:
          label: Tier
        record:
          label: Record
          align: right
        adjusted_efficiency_margin:
          label: Margin
          format: "+.1f"
          align: right
          scale:
            background:
              palette: ["#dfebfb", "#a2c3f0", "#83afea"]
              domain: data
        adjusted_offensive_efficiency:
          label: Offence
          format: ".1f"
          align: right
        offense_rank:
          label: Off rank
          format: integer
          align: right
        adjusted_defensive_efficiency:
          label: Defence
          format: ".1f"
          align: right
        defense_rank:
          label: Def rank
          format: integer
          align: right
        adjusted_tempo:
          label: Tempo
          format: ".1f"
          align: right
        elo_rating:
          label: Elo
          format: integer
          align: right
        made_ncaa_tournament:
          label: Made the field

rows:
  # The header: the court banner from _header.yml, with the bar of buttons
  # in it. This board's button is the one named in charts.banner.
  - banner
  # One short line saying what the page is. The charts carry the rest.
  - text: |
      Every Division I team, ranked and cut into tiers.
  - cols: [kpi_teams, kpi_best]
  - cols: [quadrant]
  - cols: [order_board, tier_table]
  - cols: [full_table]
