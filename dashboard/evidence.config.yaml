# Evidence reads the same DuckDB file dbt writes, so the dashboard is never
# more than one pipeline run behind the models.
title: Full Data Stack Lab

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}

deployment:
  # GitHub Pages serves a project site under /<repo>, so every asset and link
  # has to be built with that prefix. Set this back to "" when the dashboard
  # moves to a domain of its own, where it sits at the root.
  basePath: "/full-data-stack-lab"
