# Evidence reads the same DuckDB file dbt writes, so the dashboard is never
# more than one pipeline run behind the models.
title: Full Data Stack Lab

# Light and dark, matching cameronspilker.com: both follow the operating system
# unless the reader says otherwise, and both remember the choice. The switcher
# is in the header menu, or Ctrl/Cmd + Shift + L.
appearance:
  default: system
  switcher: true

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}

deployment:
  # Served from a domain of its own, so the dashboard sits at the root. A host
  # that serves it under a subpath (a GitHub Pages project site, say) needs the
  # prefix here instead.
  basePath: ""
