# The tools this project tracks. One entry per tool; a tool always has a
# GitHub repo and optionally a PyPI package. `category` drives the
# head-to-head comparison marts, so keep the values in sync with the
# accepted_values test on mart_tool_comparison.
tools:
  - name: dbt
    repo: dbt-labs/dbt-core
    pypi: dbt-core
    category: transformation
  - name: dbt-duckdb
    repo: duckdb/dbt-duckdb
    pypi: dbt-duckdb
    category: transformation
  - name: sqlmesh
    repo: TobikoData/sqlmesh
    pypi: sqlmesh
    category: transformation
  - name: dagster
    repo: dagster-io/dagster
    pypi: dagster
    category: orchestration
  - name: airflow
    repo: apache/airflow
    pypi: apache-airflow
    category: orchestration
  - name: prefect
    repo: PrefectHQ/prefect
    pypi: prefect
    category: orchestration
  - name: mage
    repo: mage-ai/mage-ai
    pypi: mage-ai
    category: orchestration
  - name: airbyte
    repo: airbytehq/airbyte
    pypi: null
    category: ingestion
  - name: dlt
    repo: dlt-hub/dlt
    pypi: dlt
    category: ingestion
  - name: meltano
    repo: meltano/meltano
    pypi: meltano
    category: ingestion
  - name: duckdb
    repo: duckdb/duckdb
    pypi: duckdb
    category: storage
  - name: clickhouse
    repo: ClickHouse/ClickHouse
    pypi: null
    category: storage
  - name: iceberg
    repo: apache/iceberg
    pypi: null
    category: storage
  - name: evidence
    repo: evidence-dev/evidence
    pypi: null
    category: bi
  - name: metabase
    repo: metabase/metabase
    pypi: null
    category: bi
  - name: superset
