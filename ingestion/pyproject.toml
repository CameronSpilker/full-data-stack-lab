[project]
name = "ingestion"
version = "0.1.0"
description = "GitHub and PyPI extractors for the full data stack lab"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ingest = "ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "B", "DTZ", "LOG", "RUF"]
