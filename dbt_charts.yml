# dbt Charts project config. The boards live in charts/; this file only says
# where their data comes from.
#
# The warehouse is the same DuckDB file dbt writes and Evidence reads, so a
# board is never more than one pipeline run behind the models it draws. It is
# not in git: the pipeline builds it and publishes it as a release asset, and
# charts/README.md says how to get a copy locally.
name: full_data_stack_lab_charts

sources:
  warehouse:
    type: duckdb
    path: ./data/warehouse.duckdb
    schema: marts
