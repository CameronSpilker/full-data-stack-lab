# dbt Charts project config. The boards live in charts/; this file only says
# where their data comes from.
#
# The warehouse is the same DuckDB file dbt writes and Evidence reads, so a
# board is never more than one pipeline run behind the models it draws. It is
# not in git: the pipeline builds it and publishes it as a release asset, and
# charts/README.md says how to get a copy locally.

# The board syntax these boards are written in. dct validate rejects newer
# syntax and dct migrate stops here, so a dbt-charts upgrade that changes the
# grammar is a deliberate edit to this line, not a side effect of a pip
# install. Bump it together with the pin in charts/requirements.txt.
locked_schema_version: "0.11.0"

sources:
  warehouse:
    type: duckdb
    path: ./data/warehouse.duckdb
    schema: marts
