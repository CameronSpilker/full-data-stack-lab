name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run it by hand against any branch. GitHub does not always raise a
  # pull_request event for a push, and when it does not there is otherwise no
  # way to get CI onto that commit short of an empty commit or reopening the
  # pull request, neither of which is a thing to do to a branch.
  workflow_dispatch:

env:
  # Absolute, because several steps run with `working-directory: transform`,
  # where a relative path would resolve to transform/transform.
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform

jobs:
  transform:
    name: dbt build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -e "ingestion[dev]" -r transform/requirements.txt

      - name: Lint
        run: ruff check ingestion orchestration scripts

      - name: Unit tests
        run: pytest ingestion/tests -q

      - name: dbt deps
        working-directory: transform
        run: dbt deps

      # The live extractors need an API key and a network. CI runs against
      # deterministic synthetic seasons instead: every model, every test, and
      # every dashboard query is exercised — only the results are invented.
      - name: Simulate synthetic seasons
        run: ingest demo

      - name: dbt build
        working-directory: transform
        env:
          DUCKDB_PATH: ../data/warehouse.duckdb
        run: dbt build --target ci

      # The daily run is `ingest daily`, which skips the team dimension on
      # purpose, and the pipeline carries the previous warehouse forward. So a
      # column added to the team extractor reaches dbt weeks before anything
      # re-extracts the teams, and a model that reads it plainly fails every
      # nightly run in between. `logo_url` did exactly that and took the
      # pipeline down for a day: CI was green the whole time, because CI always
      # builds raw from a fresh `ingest demo` and never sees the narrow table
      # production actually has.
      #
      # So this drops the newest such column and rebuilds. It runs last, after
      # docs, because it deliberately leaves the warehouse in the older shape.
      - name: dbt docs generate
        working-directory: transform
        env:
          DUCKDB_PATH: ../data/warehouse.duckdb
        run: dbt docs generate --target ci

      - name: Build against a team table that predates the newest column
        env:
          DUCKDB_PATH: data/warehouse.duckdb
        run: |
          python -c "
          import duckdb
          with duckdb.connect('data/warehouse.duckdb') as con:
              con.execute('alter table raw.ncaa_teams drop column logo_url')
          print('Dropped logo_url from raw.ncaa_teams.')
          "
          cd transform && DUCKDB_PATH=../data/warehouse.duckdb dbt build --target ci

  orchestrate:
    name: Dagster definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -e ingestion -r transform/requirements.txt
          pip install -e orchestration

      - name: Build the dbt manifest the code location reads at import
        working-directory: transform
        run: |
          dbt deps
          dbt parse --target ci

      - name: Validate the asset graph loads
        env:
          DUCKDB_PATH: data/warehouse.duckdb
        run: dagster definitions validate -m full_data_stack_lab.definitions

  charts:
    name: dbt charts boards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -e ingestion -r transform/requirements.txt
          pip install -r charts/requirements.txt

      - name: Build the warehouse the boards read
        run: |
          ingest demo
          cd transform
          dbt deps
          DUCKDB_PATH=../data/warehouse.duckdb dbt build --target ci

      # Cheap and needs no database, so it runs first and names a bad key with
      # a line number rather than leaving it to a failed render.
      #
      # Globbed rather than listed. The list here was four boards and the
      # folder has since grown, so a new board was being rendered without ever
      # being validated: the render is the slower check and it reports a bad
      # key as a failed chart rather than as a line number. `meta.yml` is the
      # folder's shared style rather than a board, and `dct validate` accepts
      # it, so the glob needs no exception.
      - name: Validate the board YAML
        run: dct validate charts/*.yml

      # A board resolves its SQL at render time, exactly like Evidence, so a
      # renamed mart column is a broken page rather than a failed dbt run.
      # Rendering here against the synthetic seasons closes that gap on the
      # pull request instead of on the nightly publish.
      - name: Render every board
        run: bash scripts/render-charts.sh

  dashboard:
    name: Evidence build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the warehouse the dashboard reads
        run: |
          pip install -e ingestion -r transform/requirements.txt
          ingest demo
          cd transform
          dbt deps
          DUCKDB_PATH=../data/warehouse.duckdb dbt build --target ci

      # Evidence resolves its SQL at build time, so a renamed mart column is a
      # broken dashboard rather than a failed dbt run. This closes that gap
      # before the much slower Evidence build runs.
      - name: Validate every dashboard query against the warehouse
        run: python scripts/validate_dashboard_queries.py

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # Deliberately not `build:deploy`: that fetches the published warehouse,
      # and CI is checking that this branch's code builds, against the
      # synthetic seasons generated above.
      - name: Build
        working-directory: dashboard
        run: |
          npm run sources
          npm run build
