name: Daily pipeline

# Extracts the last few days of basketball, rebuilds the models, and publishes
# the warehouse as a release asset.
#
# The warehouse is not committed. It is a 17MB binary that changes on every run
# even when no games were played, because every row carries the timestamp it was
# extracted at. Committing it daily would add roughly its own size to the
# repository's history every day, for a file nobody reads as text and git cannot
# diff. A release asset is overwritten in place instead, so the repository stays
# the size of its source and the dashboard still has one URL to fetch.

on:
  schedule:
    # 06:00 America/Denver (13:00 UTC), after the last west coast final and
    # before anyone looks at the dashboard.
    - cron: "0 13 * * *"

    # And the 1st of the month, an hour earlier, with the team dimension
    # included. The nightly run deliberately leaves that table alone, so
    # without this nothing in production would ever refresh it: the monthly
    # refresh lives in the Dagster schedule, and Dagster is not what runs
    # here. Conference realignment would land in July and never arrive.
    - cron: "0 12 1 * *"

  # A merge that adds or changes a model makes the published warehouse wrong
  # for the code that is now deployed: the dashboard reads a table its own
  # models have only just started producing, and Evidence renders the error
  # rather than failing the build. Republishing on the merge closes that to
  # minutes instead of leaving it until 06:00. Paths, because a change to the
  # README cannot change what the warehouse holds.
  push:
    branches: [main]
    paths:
      - "transform/**"
      - "ingestion/**"
      - ".github/workflows/pipeline.yml"

  workflow_dispatch:
    inputs:
      backfill:
        description: "Extract every season in seasons.yml in full, not just recent days"
        type: boolean
        default: false
      since_days:
        description: "Days of games and lines to refresh on a normal run"
        type: string
        default: "7"
      refresh_teams:
        description: "Include the team dimension, as the monthly run does"
        type: boolean
        default: false

permissions:
  contents: write

# One writer at a time. The release is overwritten in place, so a push run and
# the scheduled run finishing together would race to upload it. Queued rather
# than cancelled: a half-finished extract that gets killed is worse than a
# redundant one that waits.
concurrency:
  group: warehouse-publish
  cancel-in-progress: false

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform
  WAREHOUSE_RELEASE: warehouse-latest

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ingestion -r transform/requirements.txt

      # A daily run corrects and extends the warehouse it built yesterday, so
      # it has to start from that one. Its absence is not an error: the first
      # run ever, and any run after the release is deleted, simply builds from
      # nothing and uploads a complete warehouse at the end.
      - name: Fetch the previous warehouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download "$WAREHOUSE_RELEASE" \
              --pattern warehouse.duckdb --dir data --clobber 2>/dev/null; then
            echo "Starting from the previous warehouse ($(du -h data/warehouse.duckdb | cut -f1))."
          else
            echo "::notice::No previous warehouse found. Building from scratch."
          fi

      # Only the season in progress is refreshed, and only its recent days:
      # finished games do not change, and the loader upserts on the row key, so
      # a rolling window corrects what it covers and leaves the rest alone.
      # `backfill` re-extracts every season in full when history is needed.
      #
      # `daily` rather than `all`: it skips the team dimension, which changes
      # once a year and was costing this run its first four requests every
      # night, in the one position where a throttled endpoint kills everything
      # behind it. A backfill still asks for everything, because that is when
      # the dimension is genuinely being rebuilt, and so does the monthly
      # schedule, which is what keeps that table from going stale. Which cron
      # fired is readable from the event, so the two schedules share one job
      # rather than duplicating the publish and redeploy steps.
      - name: Ingest
        env:
          CBD_API_KEY: ${{ secrets.CBD_API_KEY }}
          DUCKDB_PATH: data/warehouse.duckdb
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            # A backfill is thousands of requests in one go, which is what
            # exhausts the API's rate limit. Nobody is waiting on it, so it
            # asks more slowly rather than spending the run backing off.
            REQUEST_DELAY_SECONDS=1.5 ingest all
          elif [ "${{ github.event.schedule }}" = "0 12 1 * *" ] \
              || [ "${{ inputs.refresh_teams }}" = "true" ]; then
            echo "Monthly run: refreshing the team dimension too."
            ingest all --current-only --since-days "${{ inputs.since_days || 7 }}"
          else
            ingest daily --current-only --since-days "${{ inputs.since_days || 7 }}"
          fi

      - name: Transform
        working-directory: transform
        env:
          DUCKDB_PATH: ../data/warehouse.duckdb
        run: |
          dbt deps
          dbt build --target ci --store-failures
          dbt docs generate --target ci

      # A count says a test failed. The rows say whether the data is wrong or
      # the test is. Nobody is watching this run, so they go in the log.
      - name: Show what failed
        if: failure()
        env:
          DUCKDB_PATH: data/warehouse.duckdb
        run: python scripts/print_test_failures.py

      # dbt's docs site is one page that fetches its manifest and catalog from
      # beside itself, so those three files are the whole docs deployment. They
      # ride along with the warehouse so the dashboard build can fetch both
      # from one place.
      - name: Package the dbt docs
        run: |
          mkdir -p dist/docs
          cp transform/target/index.html dist/docs/
          cp transform/target/manifest.json dist/docs/
          cp transform/target/catalog.json dist/docs/
          tar -czf dbt-docs.tar.gz -C dist docs

      # Published only after dbt passes, so a warehouse that failed its own
      # tests is never the one the dashboard builds from.
      - name: Publish the warehouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$WAREHOUSE_RELEASE" >/dev/null 2>&1; then
            gh release create "$WAREHOUSE_RELEASE" \
              --title "Latest warehouse" \
              --notes "The current DuckDB warehouse and dbt docs, rebuilt by the daily pipeline. Overwritten in place; see the repository for the code that produced it." \
              --latest=false
          fi

          gh release upload "$WAREHOUSE_RELEASE" \
            data/warehouse.duckdb dbt-docs.tar.gz --clobber

          echo "### Warehouse published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| warehouse.duckdb | $(du -h data/warehouse.duckdb | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| dbt-docs.tar.gz | $(du -h dbt-docs.tar.gz | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      # Publishing a warehouse changes nothing a reader can see. The dashboard
      # is a static site that reads the warehouse at build time and bakes the
      # answers into HTML, so the data on the page is the data that existed
      # when the site was last built. Without this the dashboard is as fresh as
      # the last push to main rather than as fresh as the last pipeline run,
      # which is not what a daily pipeline is for.
      #
      # The hook is a URL that triggers a production build, created in the
      # Vercel project and held as a repository secret. Missing is a warning
      # rather than a failure: the warehouse is published either way, and a
      # fork with no Vercel project behind it should still get a green run.
      - name: Rebuild the dashboard against the warehouse just published
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::No VERCEL_DEPLOY_HOOK_URL secret, so the dashboard still shows the warehouse it was last built with. Create a deploy hook on the Vercel project's Git settings and add the URL as a repository secret."
            exit 0
          fi

          curl -fsS -X POST "$DEPLOY_HOOK" -o /dev/null
          echo "Triggered a production rebuild." >> "$GITHUB_STEP_SUMMARY"
