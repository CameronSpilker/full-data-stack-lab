name: Daily pipeline

on:
  schedule:
    # 06:00 America/Denver (13:00 UTC) — after the last west coast final and
    # before anyone looks at the dashboard.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Extract every season in seasons.yml, not just the current one"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ingestion -r transform/requirements.txt

      # Only the season in progress is refreshed on a schedule. Past seasons
      # are finished, and re-pulling them nightly would spend the API budget
      # rewriting rows that cannot change. `backfill` overrides that.
      - name: Ingest
        env:
          CBD_API_KEY: ${{ secrets.CBD_API_KEY }}
          DUCKDB_PATH: data/warehouse.duckdb
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            ingest all
          else
            ingest all --current-only
          fi

      - name: Transform
        working-directory: transform
        env:
          DUCKDB_PATH: ../data/warehouse.duckdb
        run: |
          dbt deps
          dbt build --target ci --store-failures
          dbt docs generate --target ci

      # A count says a test failed. The rows say whether the data is wrong or
      # the test is. Nobody is watching this run, so they go in the log.
      - name: Show what failed
        if: failure()
        env:
          DUCKDB_PATH: data/warehouse.duckdb
        run: python scripts/print_test_failures.py

      # The warehouse holds only public data and no credentials, so a build
      # from the real APIs is committed on purpose: the dashboard then builds
      # from a clean checkout without needing a pipeline run first.
      # `-f` is required because .gitignore keeps synthetic local builds out.
      - name: Commit the refreshed warehouse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/warehouse.duckdb
          if git diff --staged --quiet; then
            echo "No change in the warehouse; nothing to commit."
          else
            git commit -m "Refresh warehouse for $(date -u +%Y-%m-%d)"
            git push
          fi
